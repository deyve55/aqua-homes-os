plugins {
    id "com.android.application"
}

android {
    namespace "com.aquahomes.sentinel"
    compileSdk 35

    defaultConfig {
        applicationId "com.aquahomes.sentinel"
        minSdk 26
        targetSdk 35
        versionCode 2026072403
        versionName "0.64.0-ui-personality"
    }

    buildTypes {
        debug {
            applicationIdSuffix ".proof"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            assets.srcDirs = ["../../sentinel-app"]
        }
    }
}
