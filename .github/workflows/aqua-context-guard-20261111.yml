name: Aqua startup contract qualification
"on":
  pull_request:
    paths:
      - AGENTS.md
      - .github/workflows/aqua-context-guard-20261111.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Verify startup contract without external credentials
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("AGENTS.md")
          source = p.read_text(encoding="utf-8")
          b = len(source.encode("utf-8"))
          assert b <= 32768, f"AGENTS.md over 32KiB: {b}"
          assert source.count("<!-- AQUA_COMPACT_KERNEL_STARTUP_WAVE1_20261111 -->") == 1
          assert source.count("<!-- /AQUA_COMPACT_KERNEL_STARTUP_WAVE1_END -->") == 1
          for token in (".aqua/CHAT-CONTEXT-KERNEL.json", "00-START-HERE/SYSTEM_BOOTSTRAP.md",
                        "coordination/CROSS-APP-SYNC-CURSOR.json", "STALE_UNTIL_REFRESHED",
                        "Cross-Link", "Brain", "regression"):
              assert token in source, f"missing mandatory startup safety token: {token}"
          print("PASS compact-context startup rule; offline syntax/authority awareness only")
          PY
