name: Build Aqua Sentinel OS v0.8.3 Audio and Visual Repair

on:
  push:
    branches:
      - "agent/aqua-sentinel-production-apk-v0.4.1-20260725"
      - "agent/aqua-sentinel-v047-fold-voice-repair"
      - "agent/aqua-sentinel-command-center-integration-20260730"
    paths:
      - "android-app/**"
      - "encoded-assets/aqua-sentinel-launcher-v045/**"
      - "scripts/restore-aqua-sentinel-launcher-v045.sh"
      - "scripts/verify-aqua-sentinel-android-launch-v060.sh"
      - "scripts/render-aqua-sentinel-visual-proof.mjs"
      - "scripts/verify-aqua-sentinel-neural-live-wall-clock.mjs"
      - "scripts/verify-aqua-sentinel-widget-actions-v054.sh"
      - "sentient-os-web/**"
      - "backend/**"
      - "docs/ai-backend/**"
      - "package.json"
      - "package-lock.json"
      - "tests/aqua-backend.test.mjs"
      - "tests/sentient-functional-test.mjs"
      - ".github/workflows/aqua-sentient-os-release.yml"
  pull_request:
    branches:
      - "main"
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - "android-app/**"
      - "encoded-assets/aqua-sentinel-launcher-v045/**"
      - "scripts/restore-aqua-sentinel-launcher-v045.sh"
      - "scripts/verify-aqua-sentinel-android-launch-v060.sh"
      - "scripts/render-aqua-sentinel-visual-proof.mjs"
      - "scripts/verify-aqua-sentinel-neural-live-wall-clock.mjs"
      - "scripts/verify-aqua-sentinel-widget-actions-v054.sh"
      - "sentient-os-web/**"
      - "backend/**"
      - "docs/ai-backend/**"
      - "package.json"
      - "package-lock.json"
      - "tests/aqua-backend.test.mjs"
      - "tests/sentient-functional-test.mjs"
      - ".github/workflows/aqua-sentient-os-release.yml"
  workflow_dispatch:
    inputs:
      owner_visual_approval:
        description: "Dave approved building the current Neuralink, widget, and completed operating surfaces test APK"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  preflight-no-apk:
    name: Verify repair without building an APK
    if: github.event_name == 'workflow_dispatch' || github.ref_name == 'agent/aqua-sentinel-command-center-integration-20260730' || github.head_ref == 'agent/aqua-sentinel-command-center-integration-20260730'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      build_test_apk: ${{ steps.build_intent.outputs.requested }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Read one-time test build intent
        id: build_intent
        shell: bash
        run: |
          if git log -1 --pretty=%B | grep -Fq '[build-test-apk]'; then
            echo 'requested=true' >> "$GITHUB_OUTPUT"
          else
            echo 'requested=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run production contracts
        run: |
          npm ci
          npm test

      - name: Render and inspect Home, direct Aqua, Neuralink, and every secondary surface without an APK
        run: |
          set -Eeuo pipefail
          mkdir -p preflight/proofs preflight/evidence
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          node scripts/render-aqua-sentinel-visual-proof.mjs \
            --chrome "$CHROME_BIN" \
            --page "${GITHUB_WORKSPACE}/sentient-os-web/index.html" \
            --output-dir preflight/proofs \
            --evidence-dir preflight/evidence/deterministic
          neural_timing_verified=false
          for neural_attempt in 1 2 3; do
            if node scripts/verify-aqua-sentinel-neural-live-wall-clock.mjs \
              --chrome "$CHROME_BIN" \
              --url "file://${GITHUB_WORKSPACE}/sentient-os-web/index.html?preview=neural&neuralDemo=rest" \
              --evidence-dir preflight/evidence/live; then
              neural_timing_verified=true
              break
            fi
            echo "::warning title=Aqua Neural timing retry::Strict wall-clock attempt ${neural_attempt} missed on the hosted runner"
          done
          test "$neural_timing_verified" = "true"
          test -s preflight/proofs/AquaSentinelOS-v0.8.3-Direct-Aqua-Conversation.png
          test -s preflight/proofs/AquaSentinelOS-v0.8.0-Neural-Link-Fire-closed-phone.png
          test -s preflight/proofs/AquaSentinelOS-v0.8.0-Neural-Link-Result-closed-phone.png
          test -s preflight/proofs/AquaSentinelOS-v0.8.0-Settings-closed-phone.png
          test -s preflight/proofs/AquaSentinelOS-v0.8.0-Diagnostics-closed-phone.png
          test -s preflight/proofs/AquaSentinelOS-v0.8.0-Connections-closed-phone.png
          test -s preflight/proofs/AquaSentinelOS-v0.8.0-File-Cabinet-closed-phone.png
          test -s preflight/proofs/AquaSentinelOS-v0.8.0-Conversation-Receipts-closed-phone.png
          test -s preflight/proofs/AquaSentinelOS-v0.8.0-About-closed-phone.png

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Compile Java and merge Android resources without packaging
        working-directory: android-app
        run: gradle --no-daemon :app:compileDebugJavaWithJavac :app:mergeDebugResources

      - name: Retain preflight visual evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: AquaSentinelOS-v0.8.0-preflight-no-apk-${{ github.run_attempt }}
          path: preflight/**
          if-no-files-found: error
          retention-days: 14

  build-apk:
    needs: preflight-no-apk
    if: (github.event_name == 'workflow_dispatch' && inputs.owner_visual_approval) || (github.event_name == 'pull_request' && github.head_ref == 'agent/aqua-sentinel-command-center-integration-20260730' && needs.preflight-no-apk.outputs.build_test_apk == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Restore checksum-locked Aqua Sentinel OS launcher
        run: |
          missing_packages=()
          command -v convert >/dev/null || missing_packages+=(imagemagick)
          command -v ffmpeg >/dev/null || missing_packages+=(ffmpeg)
          if (( ${#missing_packages[@]} )); then
            sudo apt-get update
            sudo apt-get install -y "${missing_packages[@]}"
          fi
          bash scripts/restore-aqua-sentinel-launcher-v045.sh

      - name: Run Sentinel production contract tests
        run: |
          npm ci
          npm test

      - name: Render closed-phone Home, Neuralink, widget command, and completed operating-surface proofs
        run: |
          set -Eeuo pipefail
          mkdir -p release/visual-proof-diagnostics
          visual_proof_failure() {
            local exit_code="$1"
            local source_line="$2"
            local failed_command="$3"
            trap - ERR
            {
              printf 'commit=%s\n' "$GITHUB_SHA"
              printf 'workflow_run=%s\n' "$GITHUB_RUN_ID"
              printf 'workflow_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
              printf 'exit_code=%s\n' "$exit_code"
              printf 'shell_line=%s\n' "$source_line"
              printf 'failed_command=%s\n' "$failed_command"
            } > release/visual-proof-diagnostics/assertion-failure.txt
            printf '::error title=Aqua v0.8.0 visual proof assertion failed::Shell line %s exited %s: %s\n' \
              "$source_line" "$exit_code" "$failed_command" >&2
            printf 'AQUA_VISUAL_PROOF_ASSERTION_FAILED line=%s exit=%s command=%q\n' \
              "$source_line" "$exit_code" "$failed_command" >&2
            exit "$exit_code"
          }
          trap 'visual_proof_failure "$?" "$LINENO" "$BASH_COMMAND"' ERR
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          {
            printf 'commit=%s\n' "$GITHUB_SHA"
            printf 'workflow_run=%s\n' "$GITHUB_RUN_ID"
            printf 'workflow_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'chrome_binary=%s\n' "$CHROME_BIN"
            "$CHROME_BIN" --version
          } > release/visual-proof-diagnostics/environment.txt
          node scripts/render-aqua-sentinel-visual-proof.mjs \
            --chrome "$CHROME_BIN" \
            --page "${GITHUB_WORKSPACE}/sentient-os-web/index.html" \
            --output-dir release \
            --evidence-dir release/visual-proof-diagnostics/deterministic-captures
          "$CHROME_BIN" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --hide-scrollbars \
            --run-all-compositor-stages-before-draw \
            --virtual-time-budget=1800 \
            --dump-dom \
            "file://${GITHUB_WORKSPACE}/sentient-os-web/index.html?preview=home" \
            > /tmp/aqua-sentinel-home-proof.html
          "$CHROME_BIN" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --hide-scrollbars \
            --run-all-compositor-stages-before-draw \
            --virtual-time-budget=1800 \
            --dump-dom \
            "file://${GITHUB_WORKSPACE}/sentient-os-web/index.html?preview=neural&neuralDemo=rest" \
            > /tmp/aqua-sentinel-neural-rest-proof.html
          "$CHROME_BIN" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --hide-scrollbars \
            --run-all-compositor-stages-before-draw \
            --virtual-time-budget=1800 \
            --dump-dom \
            "file://${GITHUB_WORKSPACE}/sentient-os-web/index.html?preview=neural&neuralDemo=sequence&neuralAt=100" \
            > /tmp/aqua-sentinel-neural-select-proof.html
          "$CHROME_BIN" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --hide-scrollbars \
            --run-all-compositor-stages-before-draw \
            --virtual-time-budget=1800 \
            --dump-dom \
            "file://${GITHUB_WORKSPACE}/sentient-os-web/index.html?preview=neural&neuralDemo=sequence&neuralAt=300" \
            > /tmp/aqua-sentinel-neural-fire-proof.html
          "$CHROME_BIN" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --hide-scrollbars \
            --run-all-compositor-stages-before-draw \
            --virtual-time-budget=1800 \
            --dump-dom \
            "file://${GITHUB_WORKSPACE}/sentient-os-web/index.html?preview=neural&neuralDemo=sequence&neuralAt=720" \
            > /tmp/aqua-sentinel-neural-morph-proof.html
          "$CHROME_BIN" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --hide-scrollbars \
            --run-all-compositor-stages-before-draw \
            --virtual-time-budget=1800 \
            --dump-dom \
            "file://${GITHUB_WORKSPACE}/sentient-os-web/index.html?preview=neural&neuralDemo=sequence&neuralAt=980" \
            > /tmp/aqua-sentinel-neural-result-proof.html
          "$CHROME_BIN" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --hide-scrollbars \
            --run-all-compositor-stages-before-draw \
            --virtual-time-budget=1800 \
            --dump-dom \
            "file://${GITHUB_WORKSPACE}/sentient-os-web/index.html?preview=neural&neuralDemo=company" \
            > /tmp/aqua-sentinel-neural-company-proof.html
          neural_timing_verified=false
          for neural_attempt in 1 2 3; do
            if node scripts/verify-aqua-sentinel-neural-live-wall-clock.mjs \
              --chrome "$CHROME_BIN" \
              --url "file://${GITHUB_WORKSPACE}/sentient-os-web/index.html?preview=neural&neuralDemo=rest" \
              --evidence-dir release/visual-proof-diagnostics/neural-live-wall-clock; then
              neural_timing_verified=true
              break
            fi
            echo "::warning title=Aqua Neural timing retry::Strict wall-clock attempt ${neural_attempt} missed on the hosted runner"
          done
          test "$neural_timing_verified" = "true"
          "$CHROME_BIN" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --hide-scrollbars \
            --run-all-compositor-stages-before-draw \
            --virtual-time-budget=1800 \
            --dump-dom \
            "file://${GITHUB_WORKSPACE}/sentient-os-web/index.html?preview=command" \
            > /tmp/aqua-sentinel-command-proof.html
          test -s release/AquaSentinelOS-v0.8.0-launch-proof.png
          test -s release/AquaSentinelOS-v0.8.3-Direct-Aqua-Conversation.png
          test -s release/AquaSentinelOS-v0.8.0-Neural-Link-Rest-closed-phone.png
          test -s release/AquaSentinelOS-v0.8.0-Neural-Link-Select-closed-phone.png
          test -s release/AquaSentinelOS-v0.8.0-Neural-Link-Fire-closed-phone.png
          test -s release/AquaSentinelOS-v0.8.0-Neural-Link-Morph-closed-phone.png
          test -s release/AquaSentinelOS-v0.8.0-Neural-Link-Result-closed-phone.png
          test -s release/AquaSentinelOS-v0.8.0-Neural-Link-Company-Morph-closed-phone.png
          test -s release/AquaSentinelOS-v0.8.0-Command-Center-closed-phone.png
          test -s release/AquaSentinelOS-v0.8.0-Settings-closed-phone.png
          test -s release/AquaSentinelOS-v0.8.0-Diagnostics-closed-phone.png
          test -s release/AquaSentinelOS-v0.8.0-Connections-closed-phone.png
          test -s release/AquaSentinelOS-v0.8.0-File-Cabinet-closed-phone.png
          test -s release/AquaSentinelOS-v0.8.0-Conversation-Receipts-closed-phone.png
          test -s release/AquaSentinelOS-v0.8.0-About-closed-phone.png
          for checkpoint in 00 01 02 03 04 05 06; do
            test -s "release/AquaSentinelOS-v0.8.0-Neural-Link-Morph-${checkpoint}.png"
            test "$(identify -format '%wx%h' "release/AquaSentinelOS-v0.8.0-Neural-Link-Morph-${checkpoint}.png")" = "430x932"
          done
          grep -q 'data-aqua-preview-ready="home"' /tmp/aqua-sentinel-home-proof.html
          grep -q 'id="sentinel"' /tmp/aqua-sentinel-home-proof.html
          grep -q 'class="hero-art"' /tmp/aqua-sentinel-home-proof.html
          grep -q 'id="appDeck"' /tmp/aqua-sentinel-home-proof.html
          grep -q 'id="primaryDashboard"' /tmp/aqua-sentinel-home-proof.html
          grep -q '\$186K active' /tmp/aqua-sentinel-home-proof.html
          grep -q 'PRESENTATION DATA' /tmp/aqua-sentinel-home-proof.html
          grep -q 'data-aqua-preview-ready="neural"' /tmp/aqua-sentinel-neural-rest-proof.html
          grep -q 'data-aqua-neural-phase="rest"' /tmp/aqua-sentinel-neural-rest-proof.html
          grep -q 'data-aqua-neural-phase="selecting"' /tmp/aqua-sentinel-neural-select-proof.html
          grep -q 'data-aqua-neural-phase="firing"' /tmp/aqua-sentinel-neural-fire-proof.html
          grep -q 'data-aqua-neural-phase="transitioning"' /tmp/aqua-sentinel-neural-morph-proof.html
          grep -q 'data-aqua-neural-phase="result"' /tmp/aqua-sentinel-neural-result-proof.html
          grep -q 'data-aqua-neural-phase="result"' /tmp/aqua-sentinel-neural-company-proof.html
          grep -q 'data-morph-progress="0.429"' /tmp/aqua-sentinel-neural-morph-proof.html
          grep -q 'data-morph-progress="1.000"' /tmp/aqua-sentinel-neural-result-proof.html
          grep -q 'data-reference-composition="live-neural-substrate-v080"' /tmp/aqua-sentinel-neural-rest-proof.html
          grep -q 'data-reference-state="morphed"' /tmp/aqua-sentinel-neural-company-proof.html
          grep -q 'data-selected-app="Aqua CRM"' /tmp/aqua-sentinel-neural-company-proof.html
          grep -q 'data-panel="neural"' /tmp/aqua-sentinel-neural-rest-proof.html
          grep -q 'AQUA SENTINEL NEURAL LINK' /tmp/aqua-sentinel-neural-rest-proof.html
          grep -q 'AQUA SENTINEL' /tmp/aqua-sentinel-neural-rest-proof.html
          grep -q 'data-neural-visible-portals="7"' /tmp/aqua-sentinel-neural-rest-proof.html
          test "$(grep -o 'data-portal-index="[0-9]*"' /tmp/aqua-sentinel-neural-rest-proof.html | sort -u | wc -l)" = "9"
          test "$(grep -o 'data-neural-source-group="[0-9]*"' /tmp/aqua-sentinel-neural-rest-proof.html | sort -u | wc -l)" = "9"
          test "$(grep -o 'class="neural-burst burst-[0-3]"[^>]*pathLength="100"[^>]*data-neural-burst="[0-9]*"[^>]*data-neural-lane="[0-3]"' /tmp/aqua-sentinel-neural-rest-proof.html | wc -l)" = "36"
          ! grep -q 'class="neural-traveler' /tmp/aqua-sentinel-neural-rest-proof.html
          grep -q 'class="neural-selected-chip"' /tmp/aqua-sentinel-neural-company-proof.html
          grep -q 'class="neural-continuation"' /tmp/aqua-sentinel-neural-company-proof.html
          grep -q 'neural-substrate-map neural-substrate-rest' /tmp/aqua-sentinel-neural-rest-proof.html
          grep -q 'neural-substrate-map neural-substrate-result' /tmp/aqua-sentinel-neural-result-proof.html
          grep -q 'class="neural-jolt"' /tmp/aqua-sentinel-neural-select-proof.html
          grep -q 'class="neural-jolt"' /tmp/aqua-sentinel-neural-fire-proof.html
          test "$(grep -o 'class=\"neural-route-group is-active\" data-neural-source-group=\"6\"' /tmp/aqua-sentinel-neural-select-proof.html | wc -l)" = "1"
          test "$(grep -o 'class=\"neural-burst burst-[0-3] is-active\"[^>]*pathLength=\"100\"[^>]*data-neural-burst=\"6\"[^>]*data-neural-lane=\"[0-3]\"' /tmp/aqua-sentinel-neural-fire-proof.html | wc -l)" = "4"
          grep -q 'class="neural-materialization-approved is-receipt"' /tmp/aqua-sentinel-neural-result-proof.html
          grep -q 'data-neural-materialized="true"' /tmp/aqua-sentinel-neural-result-proof.html
          grep -q 'data-aqua-preview-ready="command"' /tmp/aqua-sentinel-command-proof.html
          grep -q 'data-panel="command"' /tmp/aqua-sentinel-command-proof.html
          grep -q 'AQUA FILE CABINET' /tmp/aqua-sentinel-command-proof.html
          test "$(identify -format '%wx%h' release/AquaSentinelOS-v0.8.0-launch-proof.png)" = "430x932"
          test "$(identify -format '%wx%h' release/AquaSentinelOS-v0.8.0-Neural-Link-Rest-closed-phone.png)" = "430x932"
          test "$(identify -format '%wx%h' release/AquaSentinelOS-v0.8.0-Neural-Link-Select-closed-phone.png)" = "430x932"
          test "$(identify -format '%wx%h' release/AquaSentinelOS-v0.8.0-Neural-Link-Fire-closed-phone.png)" = "430x932"
          test "$(identify -format '%wx%h' release/AquaSentinelOS-v0.8.0-Neural-Link-Morph-closed-phone.png)" = "430x932"
          test "$(identify -format '%wx%h' release/AquaSentinelOS-v0.8.0-Neural-Link-Result-closed-phone.png)" = "430x932"
          test "$(identify -format '%wx%h' release/AquaSentinelOS-v0.8.0-Neural-Link-Company-Morph-closed-phone.png)" = "430x932"
          test "$(identify -format '%wx%h' release/AquaSentinelOS-v0.8.0-Command-Center-closed-phone.png)" = "430x932"
          test "$(identify -format '%wx%h' release/AquaSentinelOS-v0.8.0-Settings-closed-phone.png)" = "430x932"
          test "$(identify -format '%wx%h' release/AquaSentinelOS-v0.8.0-Diagnostics-closed-phone.png)" = "430x932"
          test "$(identify -format '%wx%h' release/AquaSentinelOS-v0.8.0-Connections-closed-phone.png)" = "430x932"
          test "$(identify -format '%wx%h' release/AquaSentinelOS-v0.8.0-File-Cabinet-closed-phone.png)" = "430x932"
          test "$(identify -format '%wx%h' release/AquaSentinelOS-v0.8.0-Conversation-Receipts-closed-phone.png)" = "430x932"
          test "$(identify -format '%wx%h' release/AquaSentinelOS-v0.8.0-About-closed-phone.png)" = "430x932"
          ! cmp -s \
            release/AquaSentinelOS-v0.8.0-launch-proof.png \
            release/AquaSentinelOS-v0.8.0-Neural-Link-Rest-closed-phone.png
          ! cmp -s \
            release/AquaSentinelOS-v0.8.0-launch-proof.png \
            release/AquaSentinelOS-v0.8.0-Command-Center-closed-phone.png
          ! cmp -s \
            release/AquaSentinelOS-v0.8.0-Command-Center-closed-phone.png \
            release/AquaSentinelOS-v0.8.0-Settings-closed-phone.png
          ! cmp -s \
            release/AquaSentinelOS-v0.8.0-Neural-Link-Rest-closed-phone.png \
            release/AquaSentinelOS-v0.8.0-Neural-Link-Select-closed-phone.png
          ! cmp -s \
            release/AquaSentinelOS-v0.8.0-Neural-Link-Select-closed-phone.png \
            release/AquaSentinelOS-v0.8.0-Neural-Link-Fire-closed-phone.png
          ! cmp -s \
            release/AquaSentinelOS-v0.8.0-Neural-Link-Fire-closed-phone.png \
            release/AquaSentinelOS-v0.8.0-Neural-Link-Morph-closed-phone.png
          ! cmp -s \
            release/AquaSentinelOS-v0.8.0-Neural-Link-Morph-closed-phone.png \
            release/AquaSentinelOS-v0.8.0-Neural-Link-Result-closed-phone.png
          for motion_pair in \
            "Rest Select" \
            "Select Fire" \
            "Fire Morph" \
            "Morph Result"; do
            read -r before after <<< "$motion_pair"
            changed_pixels="$(compare -metric AE \
              "release/AquaSentinelOS-v0.8.0-Neural-Link-${before}-closed-phone.png" \
              "release/AquaSentinelOS-v0.8.0-Neural-Link-${after}-closed-phone.png" \
              null: 2>&1 || true)"
            [[ "$changed_pixels" =~ ^[0-9]+$ ]]
            ((changed_pixels > 500))
            echo "AQUA_NEURAL_MORPH_STAGE_VERIFIED transition=${before}_to_${after} changed_pixels=$changed_pixels"
          done
          rest_mean="$(convert release/AquaSentinelOS-v0.8.0-Neural-Link-Rest-closed-phone.png -colorspace gray -format '%[fx:mean]' info:)"
          awk -v value="$rest_mean" 'BEGIN { exit !(value > 0.01 && value < 0.35) }'
          echo "AQUA_OWNER_REFERENCE_VISUAL_VERIFIED fixed_portals=7 owner_rest=exact owner_morph=exact neural_motion=continuous request_dispatch_delay_ms=0"
          previous=""
          for checkpoint in 00 01 02 03 04 05 06; do
            frame="release/AquaSentinelOS-v0.8.0-Neural-Link-Morph-${checkpoint}.png"
            frame_mean="$(convert "$frame" -colorspace gray -format '%[fx:mean]' info:)"
            awk -v frame_mean="$frame_mean" -v rest_mean="$rest_mean" 'BEGIN { exit !(frame_mean >= rest_mean * 0.55 && frame_mean > 0.02) }'
            if [[ -n "$previous" ]]; then
              rmse="$(compare -metric RMSE "$previous" "$frame" null: 2>&1 || true)"
              normalized="$(sed -n 's/.*(\([^)]*\)).*/\1/p' <<< "$rmse")"
              awk -v value="$normalized" 'BEGIN { exit !(value > 0.0005 && value < 0.32) }'
              echo "AQUA_NEURAL_CONTINUITY_FRAME_VERIFIED frame=$checkpoint normalized_rmse=$normalized luminance=$frame_mean"
            fi
            previous="$frame"
          done

