name: Build Aqua Sentient OS Fold 7 Full Installer v0.2.2

on:
  push:
    branches:
      - agent/aqua-sentient-os-direct-apk-v0.2.0-20260724
    paths:
      - "android-app/**"
      - "sentient-os-web/**"
      - ".github/workflows/aqua-sentient-os-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aqua-sentient-os-v0.2.2-fold7-full
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android verification tools
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Verify approved straight visual layers
        run: |
          cat sentient-os-assets/approved-ui-front-master.b64.part-* \
            | base64 --decode > /tmp/approved-ui-front-master.png
          python3 - <<'PY'
          import struct
          from pathlib import Path
          image = Path("/tmp/approved-ui-front-master.png").read_bytes()
          assert image[:8] == b"\x89PNG\r\n\x1a\n"
          assert struct.unpack(">II", image[16:24]) == (868, 1812)
          required = (
              "ui-header.png", "ui-hero.png", "ui-deck.png", "ui-alerts.png",
              "ui-nav.png", "card-overview-front-v11.png",
              "card-site-intelligence-front-v11.png",
              "card-financial-command-front-v11.png",
              "card-operations-front-v11.png",
              "card-risk-monitor-front-v11.png", "icon-192.png", "icon-512.png",
          )
          assets = Path("sentient-os-web/assets")
          for name in required:
              path = assets / name
              assert path.is_file() and path.stat().st_size > 0, name
          PY

      - name: Install approved web interface into APK
        run: |
          mkdir -p android-app/app/src/main/assets/public
          cp -R sentient-os-web/. android-app/app/src/main/assets/public/

      - name: Create dedicated Aqua test release certificate
        run: |
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/aqua-sentient-fold7-test.keystore" \
            -storepass "AquaSentientTest2026" \
            -keypass "AquaSentientTest2026" \
            -alias "aqua-sentient-fold7-test" \
            -keyalg RSA \
            -keysize 3072 \
            -validity 3650 \
            -dname "CN=Aqua Sentient OS Fold 7 Test, OU=Aqua Homes OS, O=Aqua Homes Design Group, L=Hudson, ST=Massachusetts, C=US"
          {
            echo "AQUA_TEST_KEYSTORE_PATH=$RUNNER_TEMP/aqua-sentient-fold7-test.keystore"
            echo "AQUA_TEST_KEYSTORE_PASSWORD=AquaSentientTest2026"
            echo "AQUA_TEST_KEY_ALIAS=aqua-sentient-fold7-test"
            echo "AQUA_TEST_KEY_PASSWORD=AquaSentientTest2026"
          } >> "$GITHUB_ENV"

      - name: Build complete release-signed base APK
        working-directory: android-app
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Verify APK with Android tools
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          APK="android-app/app/build/outputs/apk/release/app-release.apk"
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 "$APK"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='com.aquahomes.sentientos.fold7full'" /tmp/badging.txt
          grep -q "versionCode='2026072404'" /tmp/badging.txt
          grep -q "sdkVersion:'26'" /tmp/badging.txt
          grep -q "targetSdkVersion:'35'" /tmp/badging.txt
          unzip -l "$APK" | grep -q "assets/public/index.html"
          unzip -l "$APK" | grep -q "assets/public/assets/ui-hero.png"
          unzip -t "$APK"

      - name: Prove clean install and launch on Android
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb uninstall com.aquahomes.sentientos.fold7full || true
            adb install --no-incremental android-app/app/build/outputs/apk/release/app-release.apk
            adb logcat -c
            adb shell am start -W -n com.aquahomes.sentientos.fold7full/com.aquahomes.sentientos.MainActivity
            sleep 3
            adb logcat -d > /tmp/aqua-sentient-v0.2.2-logcat.txt
            adb shell pidof com.aquahomes.sentientos.fold7full | grep -q . || (grep -E "FATAL EXCEPTION|AndroidRuntime|chromium|WebViewFactory" /tmp/aqua-sentient-v0.2.2-logcat.txt || true; exit 1)
            adb shell dumpsys package com.aquahomes.sentientos.fold7full | grep -q "versionCode=2026072404"
            adb exec-out screencap -p > /tmp/aqua-sentient-v0.2.2-launch.png
            test -s /tmp/aqua-sentient-v0.2.2-launch.png

      - name: Prepare release files
        run: |
          mkdir -p release
          cp android-app/app/build/outputs/apk/release/app-release.apk release/AquaSentientOS-v0.2.2-FULL-INSTALLER.apk
          cp /tmp/aqua-sentient-v0.2.2-launch.png release/AquaSentientOS-v0.2.2-launch-proof.png
          sha256sum release/AquaSentientOS-v0.2.2-FULL-INSTALLER.apk > release/AquaSentientOS-v0.2.2-FULL-INSTALLER.apk.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: AquaSentientOS-v0.2.2-FULL-INSTALLER
          path: release/*
          if-no-files-found: error

      - name: Publish full standalone GitHub installer
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: aqua-sentient-os-v0.2.2-full-installer
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            gh release create "$RELEASE_TAG" release/* \
              --title "Aqua Sentient OS v0.2.2 Full Standalone Installer" \
              --notes "Complete release-signed base APK. Requires no prior Aqua app. The release gate performs a clean adb install and launches Aqua on an Android 15 emulator before publication. Includes the approved straight visual interface inside the APK and does not redirect through ChatGPT."
          fi
