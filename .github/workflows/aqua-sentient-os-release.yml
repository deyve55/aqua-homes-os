name: Build Aqua Sentinel OS v0.7.3 Exact Fidelity Materialization and Widget Test

on:
  push:
    branches:
      - "agent/aqua-sentinel-production-apk-v0.4.1-20260725"
      - "agent/aqua-sentinel-v047-fold-voice-repair"
      - "agent/aqua-sentinel-command-center-integration-20260730"
    paths:
      - "android-app/**"
      - "encoded-assets/aqua-sentinel-launcher-v045/**"
      - "scripts/restore-aqua-sentinel-launcher-v045.sh"
      - "scripts/verify-aqua-sentinel-android-launch-v060.sh"
      - "scripts/verify-aqua-sentinel-widget-actions-v054.sh"
      - "sentient-os-web/**"
      - "backend/**"
      - "docs/ai-backend/**"
      - "package.json"
      - "package-lock.json"
      - "tests/aqua-backend.test.mjs"
      - "tests/sentient-functional-test.mjs"
      - ".github/workflows/aqua-sentient-os-release.yml"
  pull_request:
    branches:
      - "main"
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - "android-app/**"
      - "encoded-assets/aqua-sentinel-launcher-v045/**"
      - "scripts/restore-aqua-sentinel-launcher-v045.sh"
      - "scripts/verify-aqua-sentinel-android-launch-v060.sh"
      - "scripts/verify-aqua-sentinel-widget-actions-v054.sh"
      - "sentient-os-web/**"
      - "backend/**"
      - "docs/ai-backend/**"
      - "package.json"
      - "package-lock.json"
      - "tests/aqua-backend.test.mjs"
      - "tests/sentient-functional-test.mjs"
      - ".github/workflows/aqua-sentient-os-release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-apk:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/aqua-sentinel-command-center-integration-20260730'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Restore checksum-locked Aqua Sentinel OS launcher
        run: |
          if ! command -v convert >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y imagemagick
          fi
          bash scripts/restore-aqua-sentinel-launcher-v045.sh

      - name: Run Sentinel production contract tests
        run: |
          npm ci
          npm test

      - name: Render closed-phone Home, living Neural Link, and Command Center proofs
        run: |
          mkdir -p release
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          "$CHROME_BIN" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --hide-scrollbars \
            --run-all-compositor-stages-before-draw \
            --virtual-time-budget=1800 \
            --force-device-scale-factor=1 \
            --window-size=430,932 \
            --screenshot=release/AquaSentinelOS-v0.7.3-launch-proof.png \
            "file://${GITHUB_WORKSPACE}/sentient-os-web/index.html?preview=home"
          "$CHROME_BIN" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --hide-scrollbars \
            --run-all-compositor-stages-before-draw \
            --virtual-time-budget=1800 \
            --force-device-scale-factor=1 \
            --window-size=430,932 \
            --screenshot=release/AquaSentinelOS-v0.7.3-Neural-Link-Rest-closed-phone.png \
            "file://${GITHUB_WORKSPACE}/sentient-os-web/index.html?preview=neural&neuralDemo=rest"
          "$CHROME_BIN" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --hide-scrollbars \
            --run-all-compositor-stages-before-draw \
            --virtual-time-budget=1800 \
            --force-device-scale-factor=1 \
            --window-size=430,932 \
            --screenshot=release/AquaSentinelOS-v0.7.3-Neural-Link-Rotate-closed-phone.png \
            "file://${GITHUB_WORKSPACE}/sentient-os-web/index.html?preview=neural&neuralDemo=rotate"
          "$CHROME_BIN" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --hide-scrollbars \
            --run-all-compositor-stages-before-draw \
            --virtual-time-budget=1800 \
            --force-device-scale-factor=1 \
            --window-size=430,932 \
            --screenshot=release/AquaSentinelOS-v0.7.3-Neural-Link-Fire-closed-phone.png \
            "file://${GITHUB_WORKSPACE}/sentient-os-web/index.html?preview=neural&neuralDemo=fire"
          "$CHROME_BIN" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --hide-scrollbars \
            --run-all-compositor-stages-before-draw \
            --virtual-time-budget=1800 \
            --force-device-scale-factor=1 \
            --window-size=430,932 \
            --screenshot=release/AquaSentinelOS-v0.7.3-Neural-Link-Morph-closed-phone.png \
            "file://${GITHUB_WORKSPACE}/sentient-os-web/index.html?preview=neural&neuralDemo=transition"
          "$CHROME_BIN" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --hide-scrollbars \
            --run-all-compositor-stages-before-draw \
            --virtual-time-budget=1800 \
            --force-device-scale-factor=1 \
            --window-size=430,932 \
            --screenshot=release/AquaSentinelOS-v0.7.3-Neural-Link-Result-closed-phone.png \
            "file://${GITHUB_WORKSPACE}/sentient-os-web/index.html?preview=neural&neuralDemo=result"
          "$CHROME_BIN" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --hide-scrollbars \
            --run-all-compositor-stages-before-draw \
            --virtual-time-budget=1800 \
            --force-device-scale-factor=1 \
            --window-size=430,932 \
            --screenshot=release/AquaSentinelOS-v0.7.3-Command-Center-closed-phone.png \
            "file://${GITHUB_WORKSPACE}/sentient-os-web/index.html?preview=command"
          "$CHROME_BIN" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --hide-scrollbars \
            --run-all-compositor-stages-before-draw \
            --virtual-time-budget=1800 \
            --dump-dom \
            "file://${GITHUB_WORKSPACE}/sentient-os-web/index.html?preview=home" \
            > /tmp/aqua-sentinel-home-proof.html
          "$CHROME_BIN" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --hide-scrollbars \
            --run-all-compositor-stages-before-draw \
            --virtual-time-budget=1800 \
            --dump-dom \
            "file://${GITHUB_WORKSPACE}/sentient-os-web/index.html?preview=neural&neuralDemo=rest" \
            > /tmp/aqua-sentinel-neural-rest-proof.html
          "$CHROME_BIN" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --hide-scrollbars \
            --run-all-compositor-stages-before-draw \
            --virtual-time-budget=1800 \
            --dump-dom \
            "file://${GITHUB_WORKSPACE}/sentient-os-web/index.html?preview=neural&neuralDemo=rotate" \
            > /tmp/aqua-sentinel-neural-rotate-proof.html
          "$CHROME_BIN" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --hide-scrollbars \
            --run-all-compositor-stages-before-draw \
            --virtual-time-budget=1800 \
            --dump-dom \
            "file://${GITHUB_WORKSPACE}/sentient-os-web/index.html?preview=neural&neuralDemo=fire" \
            > /tmp/aqua-sentinel-neural-fire-proof.html
          "$CHROME_BIN" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --hide-scrollbars \
            --run-all-compositor-stages-before-draw \
            --virtual-time-budget=1800 \
            --dump-dom \
            "file://${GITHUB_WORKSPACE}/sentient-os-web/index.html?preview=neural&neuralDemo=transition" \
            > /tmp/aqua-sentinel-neural-morph-proof.html
          "$CHROME_BIN" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --hide-scrollbars \
            --run-all-compositor-stages-before-draw \
            --virtual-time-budget=1800 \
            --dump-dom \
            "file://${GITHUB_WORKSPACE}/sentient-os-web/index.html?preview=neural&neuralDemo=result" \
            > /tmp/aqua-sentinel-neural-result-proof.html
          "$CHROME_BIN" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --hide-scrollbars \
            --run-all-compositor-stages-before-draw \
            --virtual-time-budget=1800 \
            --dump-dom \
            "file://${GITHUB_WORKSPACE}/sentient-os-web/index.html?preview=command" \
            > /tmp/aqua-sentinel-command-proof.html
          test -s release/AquaSentinelOS-v0.7.3-launch-proof.png
          test -s release/AquaSentinelOS-v0.7.3-Neural-Link-Rest-closed-phone.png
          test -s release/AquaSentinelOS-v0.7.3-Neural-Link-Rotate-closed-phone.png
          test -s release/AquaSentinelOS-v0.7.3-Neural-Link-Fire-closed-phone.png
          test -s release/AquaSentinelOS-v0.7.3-Neural-Link-Morph-closed-phone.png
          test -s release/AquaSentinelOS-v0.7.3-Neural-Link-Result-closed-phone.png
          test -s release/AquaSentinelOS-v0.7.3-Command-Center-closed-phone.png
          grep -q 'data-aqua-preview-ready="home"' /tmp/aqua-sentinel-home-proof.html
          grep -q 'id="sentinel"' /tmp/aqua-sentinel-home-proof.html
          grep -q 'class="hero-art"' /tmp/aqua-sentinel-home-proof.html
          grep -q 'id="appDeck"' /tmp/aqua-sentinel-home-proof.html
          grep -q 'id="primaryDashboard"' /tmp/aqua-sentinel-home-proof.html
          grep -q '8 open leads' /tmp/aqua-sentinel-home-proof.html
          grep -q 'PRESENTATION DATA' /tmp/aqua-sentinel-home-proof.html
          grep -q 'data-aqua-preview-ready="neural"' /tmp/aqua-sentinel-neural-rest-proof.html
          grep -q 'data-aqua-neural-phase="rest"' /tmp/aqua-sentinel-neural-rest-proof.html
          grep -q 'data-aqua-neural-phase="rotating"' /tmp/aqua-sentinel-neural-rotate-proof.html
          grep -q 'data-aqua-neural-phase="firing"' /tmp/aqua-sentinel-neural-fire-proof.html
          grep -q 'data-aqua-neural-phase="transitioning"' /tmp/aqua-sentinel-neural-morph-proof.html
          grep -q 'data-aqua-neural-phase="result"' /tmp/aqua-sentinel-neural-result-proof.html
          grep -q 'data-panel="neural"' /tmp/aqua-sentinel-neural-rest-proof.html
          grep -q 'AQUA SENTINEL NEURAL LINK' /tmp/aqua-sentinel-neural-rest-proof.html
          grep -q 'Aqua Neuralink' /tmp/aqua-sentinel-neural-rest-proof.html
          grep -q 'class="neural-microbursts"' /tmp/aqua-sentinel-neural-rest-proof.html
          grep -q 'class="neural-jolt"' /tmp/aqua-sentinel-neural-rotate-proof.html
          grep -q 'class="neural-jolt"' /tmp/aqua-sentinel-neural-fire-proof.html
          grep -q 'Aqua is rotating Receipts into the top portal' /tmp/aqua-sentinel-neural-rotate-proof.html
          grep -q 'Aqua is firing a large upward neuron burst through the selected path' /tmp/aqua-sentinel-neural-fire-proof.html
          grep -q 'class="neural-materialization-approved is-receipt"' /tmp/aqua-sentinel-neural-result-proof.html
          grep -q 'data-neural-materialized="true"' /tmp/aqua-sentinel-neural-result-proof.html
          grep -q 'data-aqua-preview-ready="command"' /tmp/aqua-sentinel-command-proof.html
          grep -q 'data-panel="command"' /tmp/aqua-sentinel-command-proof.html
          grep -q 'AQUA FILE CABINET' /tmp/aqua-sentinel-command-proof.html
          test "$(identify -format '%wx%h' release/AquaSentinelOS-v0.7.3-launch-proof.png)" = "430x932"
          test "$(identify -format '%wx%h' release/AquaSentinelOS-v0.7.3-Neural-Link-Rest-closed-phone.png)" = "430x932"
          test "$(identify -format '%wx%h' release/AquaSentinelOS-v0.7.3-Neural-Link-Rotate-closed-phone.png)" = "430x932"
          test "$(identify -format '%wx%h' release/AquaSentinelOS-v0.7.3-Neural-Link-Fire-closed-phone.png)" = "430x932"
          test "$(identify -format '%wx%h' release/AquaSentinelOS-v0.7.3-Neural-Link-Morph-closed-phone.png)" = "430x932"
          test "$(identify -format '%wx%h' release/AquaSentinelOS-v0.7.3-Neural-Link-Result-closed-phone.png)" = "430x932"
          test "$(identify -format '%wx%h' release/AquaSentinelOS-v0.7.3-Command-Center-closed-phone.png)" = "430x932"
          ! cmp -s \
            release/AquaSentinelOS-v0.7.3-launch-proof.png \
            release/AquaSentinelOS-v0.7.3-Neural-Link-Rest-closed-phone.png
          ! cmp -s \
            release/AquaSentinelOS-v0.7.3-launch-proof.png \
            release/AquaSentinelOS-v0.7.3-Command-Center-closed-phone.png
          ! cmp -s \
            release/AquaSentinelOS-v0.7.3-Neural-Link-Rest-closed-phone.png \
            release/AquaSentinelOS-v0.7.3-Neural-Link-Rotate-closed-phone.png
          ! cmp -s \
            release/AquaSentinelOS-v0.7.3-Neural-Link-Rotate-closed-phone.png \
            release/AquaSentinelOS-v0.7.3-Neural-Link-Fire-closed-phone.png
          ! cmp -s \
            release/AquaSentinelOS-v0.7.3-Neural-Link-Fire-closed-phone.png \
            release/AquaSentinelOS-v0.7.3-Neural-Link-Morph-closed-phone.png
          ! cmp -s \
            release/AquaSentinelOS-v0.7.3-Neural-Link-Morph-closed-phone.png \
            release/AquaSentinelOS-v0.7.3-Neural-Link-Result-closed-phone.png
          for motion_pair in \
            "Rest Rotate" \
            "Rotate Fire" \
            "Fire Morph" \
            "Morph Result"; do
            read -r before after <<< "$motion_pair"
            changed_pixels="$(compare -metric AE \
              "release/AquaSentinelOS-v0.7.3-Neural-Link-${before}-closed-phone.png" \
              "release/AquaSentinelOS-v0.7.3-Neural-Link-${after}-closed-phone.png" \
              null: 2>&1 || true)"
            [[ "$changed_pixels" =~ ^[0-9]+$ ]]
            ((changed_pixels > 500))
            echo "AQUA_NEURAL_MORPH_STAGE_VERIFIED transition=${before}_to_${after} changed_pixels=$changed_pixels"
          done

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android verification tools
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Verify approved visual source
        run: |
          python3 - <<'PY'
          import hashlib
          import struct
          from pathlib import Path

          expected = {
              "ui-hero-front-v11.png": "d78335f4ccf77cebad9dba7d985bce979aff3e31272c4c6a85bc3f211f482df7",
              "card-financial-command-front-v11.png": "3b7bf631b4a6180d1ab2bf47ce5ec4c82dad65b0dab2e4b9f4c6247da4bc5ff1",
              "card-operations-front-v11.png": "3f8f4ebf8a500d1d74ce4b728955bed1ceea25066eb2c5754f3db1f7ff67d249",
              "card-overview-front-v11.png": "d74b1b74e62e310d89d6f900f7e9d468a7bae19aa3c84a16751af68bfd31114a",
              "card-risk-monitor-front-v11.png": "1447febbbf1245e73ee177a6bb0ae91ad3e09612e6edd57de0c1a90166940d8c",
              "card-site-intelligence-front-v11.png": "3bba50e8dc2f55f534a39e5b60de928dffcf52486b1f40cd8935455455c70055",
              "neuralink-rest-v071.png": "451eee658db139df5bb924ecf69856ecdd477df89689cb6b6fd759e83a38cec3",
              "neuralink-materialized-v071.png": "0f59fa24c599c2ab7ae7e089427619d607c942dff3d9652efd7c624ed0dc0276",
              "neuralink-materialization-five-portal-approved-v073.png": "ae86da13c7a9b138edaf295174aff9959eab5c20538def06d6dc2f78d310e7a5",
          }
          assets = Path("sentient-os-web/assets")
          for name, digest in expected.items():
              path = assets / name
              assert path.is_file() and path.stat().st_size > 0, name
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              assert actual == digest, (name, actual)

          hero = (assets / "ui-hero-front-v11.png").read_bytes()
          assert hero[:8] == b"\x89PNG\r\n\x1a\n"
          width, height = struct.unpack(">II", hero[16:24])
          assert width > 500 and height > 500, (width, height)
          for name in (
              "neuralink-rest-v071.png",
              "neuralink-materialized-v071.png",
              "neuralink-materialization-five-portal-approved-v073.png",
          ):
              neural = (assets / name).read_bytes()
              assert neural[:8] == b"\x89PNG\r\n\x1a\n"
              width, height = struct.unpack(">II", neural[16:24])
              assert (width, height) == (852, 1846), (name, width, height)

          widget_neural = Path("android-app/app/src/main/res/drawable-nodpi/aqua_widget_neuralink_v071.png")
          assert widget_neural.is_file() and widget_neural.stat().st_size > 0
          assert hashlib.sha256(widget_neural.read_bytes()).hexdigest() == "0ea55046128465e0b009bc1d65f86801bb4688bae1fa80ec77d2bcd28d84e99f"
          width, height = struct.unpack(">II", widget_neural.read_bytes()[16:24])
          assert (width, height) == (900, 900), (width, height)

          widget_neural_compact = Path("android-app/app/src/main/res/drawable-nodpi/aqua_neuralink_widget_v071.webp")
          assert widget_neural_compact.is_file() and widget_neural_compact.stat().st_size > 0
          assert hashlib.sha256(widget_neural_compact.read_bytes()).hexdigest() == "d908951e61b7715d5324321e03071c4d85b1b110e84ed87e4cb97f87a39565e8"

          exact_widgets = {
              "aqua_widget_4x6_approved_v073.png": (
                  "5c4f5b4f6af264e8ccc9378885a4821c4ff5b9895dac5e984d76dffbfef8b4ca",
                  (660, 930),
              ),
              "aqua_widget_2x2_approved_v073.png": (
                  "78fd39ad0fd80cfff1707fb49e2cec0d6b3937a913823f79cc1b86951452dbd6",
                  (470, 470),
              ),
          }
          drawable_assets = Path("android-app/app/src/main/res/drawable-nodpi")
          for name, (digest, dimensions) in exact_widgets.items():
              widget = (drawable_assets / name).read_bytes()
              assert hashlib.sha256(widget).hexdigest() == digest, name
              assert struct.unpack(">II", widget[16:24]) == dimensions, name

          launcher = Path("android-app/icon-source/AquaSentinel-BrainCircuit-approved-v045.png")
          assert launcher.is_file() and launcher.stat().st_size > 0
          assert hashlib.sha256(launcher.read_bytes()).hexdigest() == "bc1e014886d19f10ee1b8afdca2f5bc99d6d9c9ff103c2b359cc9457da80f6c5"
          width, height = struct.unpack(">II", launcher.read_bytes()[16:24])
          assert (width, height) == (512, 512)
          for density in ("mdpi", "hdpi", "xhdpi", "xxhdpi", "xxxhdpi"):
              icon = Path(f"android-app/app/src/main/res/mipmap-{density}/aqua_sentinel_launcher.png")
              foreground = Path(f"android-app/app/src/main/res/mipmap-{density}/aqua_sentinel_launcher_foreground.png")
              assert icon.is_file() and icon.stat().st_size > 0, density
              assert foreground.is_file() and foreground.stat().st_size > 0, density
          PY

      - name: Install approved interface into APK
        run: |
          mkdir -p android-app/app/src/main/assets/public
          cp -R sentient-os-web/. android-app/app/src/main/assets/public/

      - name: Create release candidate certificate
        run: |
          KEY_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$KEY_PASSWORD"
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/aqua-sentinel-v0.7.3.keystore" \
            -storepass "$KEY_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias "aqua-sentinel-v0.7.3" \
            -keyalg RSA \
            -keysize 3072 \
            -validity 3650 \
            -dname "CN=Aqua Sentinel OS v0.7.3 Exact Fidelity Materialization Widget Test, OU=Aqua Sentinel OS, O=Aqua Software Inc., L=Hudson, ST=Massachusetts, C=US"
          {
            echo "AQUA_RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/aqua-sentinel-v0.7.3.keystore"
            echo "AQUA_RELEASE_KEYSTORE_PASSWORD=$KEY_PASSWORD"
            echo "AQUA_RELEASE_KEY_ALIAS=aqua-sentinel-v0.7.3"
            echo "AQUA_RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: android-app
        run: gradle --no-daemon --stacktrace :app:assembleRelease -Paqua.ecosystemPreview=true

      - name: Verify APK package, signing, and embedded interface
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          APK="android-app/app/build/outputs/apk/release/app-release.apk"
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 "$APK"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/aqua-sentinel-certificate.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee /tmp/aqua-sentinel-badging.txt
          grep -q "package: name='com.aquahomes.sentinel'" /tmp/aqua-sentinel-badging.txt
          grep -q "versionCode='2026080202'" /tmp/aqua-sentinel-badging.txt
          grep -q "versionName='0.7.3-exact-fidelity-materialization-widget-test'" /tmp/aqua-sentinel-badging.txt
          grep -q "sdkVersion:'26'" /tmp/aqua-sentinel-badging.txt
          grep -q "targetSdkVersion:'35'" /tmp/aqua-sentinel-badging.txt
          unzip -l "$APK" | grep -q "assets/public/index.html"
          unzip -l "$APK" | grep -q "assets/public/assets/ui-hero-front-v11.png"
          unzip -l "$APK" | grep -q "assets/public/assets/neuralink-materialization-five-portal-approved-v073.png"
          unzip -l "$APK" | grep -q "assets/public/fidelity.css"
          unzip -t "$APK"

      - name: Enable KVM for the Android launcher proof
        run: |
          test -e /dev/kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

