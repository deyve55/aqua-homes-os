<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aqua Homes AI Construction OS — Structured Starter</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="hero" aria-label="Aqua Homes header placeholder">
        <p class="eyebrow">Aqua Homes</p>
        <h1>AI Construction OS</h1>
        <p class="hero-copy">
          Lightweight structured starter shell beside the locked v51 design reference.
        </p>
      </header>

      <div class="approved-gold-bar" aria-hidden="true"></div>

      <main>
        <section class="dashboard-header" aria-labelledby="main-brain-title">
          <div>
            <p class="eyebrow">Main Brain</p>
            <h2 id="main-brain-title">Command Dashboard</h2>
          </div>
          <span class="status-pill">Starter Shell</span>
        </section>

        <section class="dashboard-summary" data-dashboard-summary aria-label="Saved demo data summary"></section>

        <section class="card-grid" data-module-grid aria-label="Main Brain dashboard cards"></section>

        <aside class="module-detail" data-module-detail aria-live="polite" hidden>
          <div class="module-copy">
            <p class="eyebrow">Module Detail</p>
            <h3 data-module-title>Projects</h3>
            <p data-module-description>Track active builds, milestones, and next actions.</p>
            <section class="backup-panel" aria-label="Demo data backup controls">
              <div class="backup-panel-header">
                <div>
                  <p class="eyebrow">Demo data backup</p>
                  <h4>Export / Import</h4>
                </div>
                <p class="backup-status" data-backup-status aria-live="polite">Ready for demo data backups.</p>
              </div>
              <label class="backup-json-label" for="demo-backup-json">Pasted or exported JSON</label>
              <textarea
                id="demo-backup-json"
                class="backup-json"
                data-backup-json
                rows="5"
                spellcheck="false"
                placeholder="Export fills this box. Paste JSON here to import demo data."
              ></textarea>
              <div class="backup-actions">
                <button type="button" class="ghost-button" data-export-demo>Export JSON</button>
                <button type="button" class="ghost-button" data-import-demo>Import JSON</button>
                <button type="button" class="ghost-button" data-backup-reset>Reset demo data</button>
              </div>
            </section>
            <div class="module-demo" data-module-demo hidden></div>
          </div>
          <div class="module-actions">
            <button type="button" class="ghost-button" data-reset-demo>Reset demo data</button>
            <button type="button" data-module-close aria-label="Close module detail">Close</button>
          </div>
        </aside>
      </main>

      <nav class="bottom-nav" aria-label="Bottom navigation placeholder">
        <button type="button" data-section="home" class="active">Home</button>
        <button type="button" data-section="brain">Brain</button>
        <button type="button" data-section="projects">Projects</button>
        <button type="button" data-section="settings">Settings</button>
      </nav>
    </div>

    <script src="app.js"></script>
  </body>
</html>
