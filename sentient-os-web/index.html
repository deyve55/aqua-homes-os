<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#01070c" />
    <title>Aqua Sentinel OS</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="sentinel" class="sentinel state-idle">
      <header class="project-header">
        <div class="brand"><b>AQUA</b><small>SENTINEL OS</small></div>
        <div class="project"><strong>Northshore Mega Project</strong><span>Site ID: NS-8847 &nbsp;•&nbsp; Tower A</span></div>
        <div class="operator"><i></i><span>Dave · Owner</span></div>
      </header>

      <section class="aqua-hero" aria-label="Aqua voice assistant">
        <img src="./assets/ui-hero.png" alt="Aqua Sentinel voice emblem" />
        <button id="voiceButton" class="voice-button" type="button" aria-label="Talk to Aqua">
          <span class="voice-bars" aria-hidden="true">▮▯▮▯▮</span><b>Tap to speak</b>
        </button>
        <div id="transcript" class="transcript" hidden></div>
      </section>

      <section class="carousel-shell" aria-label="Command carousel">
        <button id="previousCard" class="arrow previous" type="button" aria-label="Previous card">‹</button>
        <div id="cardLayers" class="card-deck"></div>
        <button id="nextCard" class="arrow next" type="button" aria-label="Next card">›</button>
        <div id="cardDots" class="card-dots" aria-label="Select command card"></div>
      </section>

      <section class="intelligence-panels" aria-label="Priority intelligence">
        <button id="budgetPanel" class="intel-card" type="button">
          <span class="intel-head"><i>01</i><b>Budget Exception</b><em class="confirmed">Confirmed</em></span>
          <strong>Rebar Procurement</strong><small>Tower A &nbsp;•&nbsp; Level 34</small>
          <span class="intel-row"><label>Variance</label><b class="gold">+$237,450</b></span>
          <span class="intel-row"><label>Impact</label><b>2.1% of budget</b></span>
          <span class="intel-foot">✓ Reviewed and approved <b>›</b></span>
        </button>
        <button id="riskPanel" class="intel-card" type="button">
          <span class="intel-head"><i>02</i><b>Schedule Risk</b><em class="attention">Needs Attention</em></span>
          <strong>Concrete Pour Delay</strong><small>Tower A &nbsp;•&nbsp; Level 27</small>
          <span class="intel-row"><label>Delay</label><b class="red">3 Days</b></span>
          <span class="intel-row"><label>Impact</label><b class="red">Critical Path</b></span>
          <span class="intel-foot warning">! Action required <b>›</b></span>
        </button>
      </section>

      <nav class="bottom-rail" aria-label="Primary navigation">
        <button class="active" type="button" data-label="Home"><b>⬡</b><span>Home</span></button>
        <button type="button" data-label="Messages"><b>▱</b><span>Messages</span></button>
        <button type="button" data-label="Data Hub"><b>◇</b><span>Data Hub</span></button>
        <button type="button" data-label="Settings"><b>☷</b><span>Settings</span></button>
        <button type="button" data-label="Sign Out"><b>⇥</b><span>Sign Out</span></button>
      </nav>

      <section id="detailSheet" class="detail-sheet closed" aria-label="Card details">
        <div class="sheet-handle"></div>
        <button id="closeSheet" class="sheet-close" type="button" aria-label="Close details">×</button>
        <p id="sheetEyebrow"></p><h1 id="sheetTitle"></h1>
        <div class="sheet-metric"><strong id="sheetMetric"></strong><span id="sheetSubmetric"></span></div>
        <div class="detail-chart" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <h2>Aqua Brief</h2><p id="sheetNote"></p>
        <div id="checkResult" class="check-result" hidden></div>
        <small class="demo-note">Demonstration data · not connected to live company records</small>
        <div class="sheet-actions">
          <button id="askAqua" type="button">Ask Aqua</button>
          <button id="checkInformation" type="button">Check information</button>
          <button id="toggleDepth" type="button">Go deeper</button>
        </div>
      </section>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
